<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E4A38">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="撲克練習">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>撲克練習</title>
<style>
:root{--loss:#E07A6E;--felt:#1E4A38;--felt-d:#153729;--felt-l:#285B46;--line:#3E7059;--ivory:#F7F2E6;--ink:#1C1C1A;--red:#BE2F2A;--brass:#D6B35E;--mute:#A8C4B6;--ok:#8FD19E;--bad:#F09A8E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
html{min-height:calc(100% + env(safe-area-inset-top));background:var(--felt)}
body:before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--felt);z-index:6}
body{background:var(--felt);color:var(--ivory);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.6;padding-top:env(safe-area-inset-top)}
main{max-width:520px;margin:0 auto;padding:16px 16px calc(88px + env(safe-area-inset-bottom))}
h1{font-size:24px;font-weight:600;margin:4px 0 0;letter-spacing:.04em}
.sub{color:var(--mute);font-size:14px;margin:0 0 14px}
.lbl{font-size:13px;color:var(--mute);margin:14px 0 6px}
.cards{display:flex;gap:5px}
.cd{width:calc((100% - 30px)/7);max-width:54px;aspect-ratio:46/66;background:var(--ivory);color:var(--ink);border-radius:6px;position:relative;font-family:Georgia,"Times New Roman",serif;transition:opacity .2s;flex:none}
.cd .r{position:absolute;left:5px;top:2px;font-size:15px;font-weight:700;line-height:1.1}
.cd .s{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;padding-top:9px}
.cd.red{color:var(--red)}
.cd.dim{opacity:.3}
.cd.hl{box-shadow:0 0 0 2px var(--brass)}
.cd.slot{background:transparent;border:1.5px dashed var(--line)}
.cd.sel{border:2px solid var(--brass)}
.cd.tap{cursor:pointer}
.big .cd{width:72px;max-width:none}
.big .cd .r{font-size:22px;left:7px}.big .cd .s{font-size:34px}
button{font:inherit;color:var(--ivory);background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:46px;cursor:pointer}
button:active{background:var(--felt-l)}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
button.pri{background:var(--brass);color:var(--felt-d);border-color:var(--brass);font-weight:600}
button.full{width:100%;margin-top:6px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0;min-height:40px;font-size:15px;color:var(--mute)}
.seg button.on{background:var(--felt-l);color:var(--brass)}
.fb{margin:14px 0 10px;padding:12px 14px;border-left:3px solid var(--line);background:var(--felt-d);font-size:15px}
.fb.ok{border-color:var(--ok)}.fb.bad{border-color:var(--bad)}
.fb b{font-weight:600}
.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}
.right{border-color:var(--ok)!important;color:var(--ok)}
.wrong{border-color:var(--bad)!important;color:var(--bad)}
.score{display:block;text-align:right;font-size:13px;color:var(--mute);margin-top:8px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--felt-d);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav:after{content:"";position:absolute;top:100%;left:0;right:0;height:200px;background:var(--felt-d)}
nav button{flex:1;border:0;border-radius:0;font-size:12px;color:var(--mute);padding:8px 0 6px;min-height:58px;display:flex;flex-direction:column;align-items:center;gap:1px}
nav button .ic{font-family:Georgia,serif;font-size:21px;line-height:1}
nav button.on{color:var(--brass)}
.pos{display:inline-block;border:1px solid var(--brass);color:var(--brass);border-radius:6px;padding:2px 12px;font-size:16px}
.pick{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:3px}
.pick button{min-height:38px;padding:0;font-family:Georgia,serif;font-size:12px;border-radius:5px;background:var(--ivory);color:var(--ink);border:0;line-height:1.05}
.pick button.red{color:var(--red)}
.pick button:disabled{opacity:.15}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:46px;padding:0;font-size:20px}
.stepper span{font-family:Georgia,serif;font-size:22px;min-width:26px;text-align:center}
.big-n{font-family:Georgia,serif;font-size:56px;line-height:1.05;color:var(--brass)}
.chart{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:2px;margin-top:10px}
.chart div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:9.5px;border-radius:3px;letter-spacing:-.6px}
.t1{background:#0F6E56;color:#E1F5EE}.t2{background:#5DCAA5;color:#04342C}.t3{background:#F2C46E;color:#5A3305}.t0{color:var(--mute);border:1px solid var(--line)}
.chart .cur{outline:2px solid var(--ivory);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mute);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.stat{display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line)}
.stat .v{font-family:Georgia,serif;font-size:24px;color:var(--brass)}
.muted{color:var(--mute);font-size:14px}
.err{color:var(--bad);font-size:14px;margin:8px 0 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mini .cd{width:34px;max-width:none;border-radius:4px}
.mini .cd .r{font-size:11px;left:3px;top:1px}.mini .cd .s{font-size:15px;padding-top:7px}
.hr{padding:12px 0;border-bottom:1px solid var(--line)}
.hr .top{display:flex;align-items:baseline;gap:10px}
.hr .no{font-family:Georgia,serif;color:var(--brass);font-size:18px;width:22px}
.hr .nm{font-size:17px;font-weight:600;flex:1}
.hr .pr{font-size:12px;color:var(--mute)}
.hr .bd{display:flex;align-items:center;gap:12px;margin:6px 0 0 32px}
.hr .ds{font-size:13px;color:var(--mute);line-height:1.4}
.notes{margin:16px 0 0;padding:0 0 0 18px;font-size:14px;color:var(--ivory)}
.notes li{margin:4px 0}
.tl{position:relative;margin-top:10px;padding-left:28px}
.tl:before{content:"";position:absolute;left:10px;top:8px;bottom:8px;border-left:1.5px solid var(--line)}
.st{position:relative;padding:0 0 18px}
.st .dot{position:absolute;left:-28px;top:2px;width:22px;height:22px;border-radius:50%;background:var(--felt-d);border:1.5px solid var(--brass);color:var(--brass);font-family:Georgia,serif;font-size:12px;display:flex;align-items:center;justify-content:center}
.st h3{font-size:16px;margin:0;font-weight:600}
.st p{margin:2px 0 6px;font-size:14px;color:var(--mute)}
.st .bet{display:inline-block;font-size:12px;color:var(--brass);border:1px solid var(--brass);border-radius:4px;padding:0 6px;margin-top:6px}
.gl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin-top:8px}
.gl b{color:var(--brass);font-weight:600}
.seat-l{fill:#D6B35E;stroke:#D6B35E}.seat-m{fill:#285B46;stroke:#A8C4B6}.seat-b{fill:#153729;stroke:#F7F2E6}
.tbl{position:relative;height:320px;margin:10px 0 0}
.tbl .felt{position:absolute;inset:40px 34px 26px;border-radius:50%;background:var(--felt-l);border:6px solid var(--felt-d);box-shadow:0 0 0 1px var(--line)}
.seat{position:absolute;width:76px;transform:translate(-50%,-50%);text-align:center}
.seat .box{position:relative;background:var(--felt-d);border:1px solid var(--line);border-radius:10px;padding:4px 2px 5px}
.seat.act .box{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.seat.out .box{opacity:.5}
.seat .nm{font-size:13px;line-height:1.25}
.seat .stk{font-family:Georgia,serif;font-size:13px;color:var(--brass);line-height:1.2}
.seat .hc{display:flex;justify-content:center;gap:2px;margin-top:3px;min-height:30px}
.seat .tag{font-size:11px;color:var(--mute);line-height:1.3;min-height:15px;margin-top:2px;white-space:nowrap}
.seat.act .tag{color:var(--brass)}
.cb{width:21px;height:30px;border-radius:3px;background:repeating-linear-gradient(45deg,#8E2E29 0 3px,#A8352F 3px 6px);border:1.5px solid var(--ivory)}
.xs .cd{width:23px;max-width:none;border-radius:3px}
.xs .cd .r{font-size:10px;left:2px;top:0}.xs .cd .s{font-size:12px;padding-top:9px}
.dbtn{position:absolute;top:-8px;right:-7px;width:20px;height:20px;border-radius:50%;background:var(--ivory);color:var(--ink);font:700 11px/20px Georgia,serif;text-align:center}
.chip{position:absolute;transform:translate(-50%,-50%);font-family:Georgia,serif;font-size:13px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.chip:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--brass);border:2px dashed var(--felt-d)}
.seat.lf .dbtn{right:auto;left:-7px}
.tbl .bd{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);display:flex;gap:4px}
.tbl .bd .cd{width:37px;max-width:none}
.tbl .bd .cd .r{font-size:14px;left:4px}.tbl .bd .cd .s{font-size:19px;padding-top:10px}
.pot{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-size:13px;color:var(--mute);white-space:nowrap}
.pot b{font-family:Georgia,serif;color:var(--ivory);font-size:16px;font-weight:400}
.me{display:flex;gap:14px;align-items:center;margin-top:4px;padding:10px 12px;background:var(--felt-d);border-radius:12px;border:1px solid var(--line)}
.me.act{border-color:var(--brass)}
.me .cards .cd{width:58px;max-width:none}
.me .cards .cd .r{font-size:19px;left:6px}.me .cards .cd .s{font-size:28px;padding-top:12px}
.me .inf{flex:1;font-size:14px;line-height:1.5}
.me .inf .stk{font-family:Georgia,serif;font-size:20px;color:var(--brass)}
.need{font-size:14px;color:var(--mute);margin:12px 0 6px}
.need b{color:var(--ivory);font-weight:600}
.rp{margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.grid4 button{min-height:38px;font-size:14px;padding:4px}
input[type=range]{width:100%;accent-color:var(--brass);margin:12px 0 4px}
.log{max-height:180px;overflow:auto;font-size:13px;line-height:1.55;padding:8px 10px;background:var(--felt-d);border-radius:10px;margin-top:6px}
.log div{padding:1px 0}
.log .st{color:var(--brass);margin-top:4px}.log .sys{color:var(--mute)}.log .mine{font-weight:600}.log .win{color:var(--ok)}
.coach ul{margin:6px 0 0;padding-left:18px;font-size:14px}.coach li{margin:2px 0}
.coach .ft{font-size:12px;color:var(--mute);margin-top:6px}
.coach .ch{font-size:12px;color:var(--mute);margin:10px 0 0;letter-spacing:.06em}
.coach .nx{font-size:14px}
.coach .xp li{margin:4px 0}.coach .xp b{color:var(--brass);font-weight:600}
.dir{display:inline-block;font-size:13px;border:1px solid;border-radius:6px;padding:0 8px;margin:6px 0 4px}
.dir.agg{color:var(--brass)}
.muted a{color:var(--brass)}
.stp{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin:14px 0 4px}
.stp span{text-align:center;font-family:Georgia,serif;font-size:15px;color:var(--mute);border-top:3px solid var(--line);padding-top:4px;line-height:1.2}
.stp small{display:block;font-family:inherit;font-size:11px}
.stp .cur{color:var(--brass);border-color:var(--brass)}.stp .ok{color:var(--ok);border-color:var(--ok)}.stp .no{color:var(--bad);border-color:var(--bad)}
.ox p{margin:8px 0 0}

.eb{margin:12px 0 0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--felt-d)}
.eb .row b{font-weight:600;font-size:14px}.eb .row .muted{font-size:12px}
.ebr{display:grid;grid-template-columns:4.6em minmax(0,1fr) 3em;gap:8px;align-items:center;margin-top:8px;font-size:13px}
.ebt{position:relative;height:14px;border-radius:0 4px 4px 0;background:var(--felt-l)}
.ebt i{display:block;height:100%;background:var(--brass);border-radius:0 4px 4px 0}
.ebt b{position:absolute;top:-5px;bottom:-5px;width:2px;margin-left:-1px;background:var(--ivory);box-shadow:0 0 0 1px var(--felt-d)}
.ebv{text-align:right;font-family:Georgia,serif;font-size:16px}
.ebn{font-size:12px;color:var(--mute);margin-top:8px;line-height:1.55}.ebn b{color:var(--ivory);font-weight:600}
.tk{display:inline-block;width:2px;height:11px;background:var(--ivory);margin-right:6px;vertical-align:-1px}
.hb.tw{grid-template-columns:7.4em minmax(0,1fr) 4.6em}.tb .tr{position:relative}.tb .tr i{position:absolute;left:0;top:0}.tr i.lt{opacity:.35}
.vs{display:grid;grid-template-columns:4.6em minmax(0,1fr) 3.4em 4.2em;gap:8px;align-items:center;padding:5px 0;font-size:14px}
.vs span:nth-child(3){text-align:left}.sp{height:10px;border-radius:4px;background:var(--line);overflow:hidden}.sp i{display:block;height:100%;background:var(--brass);border-right:2px solid var(--felt)}
.mo{display:grid;grid-template-columns:4.6em repeat(5,minmax(0,1fr));gap:6px 4px;align-items:end;font-size:13px;margin-top:8px}
.mc{display:flex;flex-direction:column;align-items:center;gap:3px;font-family:Georgia,serif}.mc i{display:block;width:14px;background:var(--brass);border-radius:3px 3px 0 0}
.opp{display:grid;grid-template-columns:minmax(0,1fr) 8.6em;gap:6px 8px;padding:8px 0;border-bottom:1px solid var(--line)}
.opp .muted{grid-column:1/-1;font-size:13px}
.opp input,.opp select{font:inherit;font-size:16px;color:var(--ivory);background:var(--felt-d);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-height:40px;width:100%}
.opp select{color:var(--brass)}
.stepper button:disabled{opacity:.3}
.qz{margin-top:12px;padding:10px 12px 12px;border:1px solid var(--brass);border-radius:12px;background:var(--felt-d)}
.qz .row b{color:var(--brass)}
.qq{font-size:14px;margin:10px 0 6px}
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.chips button{min-height:40px;padding:4px;font-family:Georgia,serif;font-size:15px}
.qe{font-size:13px;color:var(--mute);margin-top:5px;line-height:1.5}
.qr{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:14px;line-height:1.6}
.lnk{border:0;min-height:0;padding:8px 0 0;color:var(--mute);font-size:13px;text-decoration:underline}
details.os{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:14px}
details.os summary{cursor:pointer;padding:10px 0;color:var(--brass);font-weight:600;list-style-position:outside;margin-left:14px}
details.os summary span{display:block;font-weight:400;font-size:12px;color:var(--mute)}
details.os .ox{padding:4px 0 10px;border-top:1px solid var(--line)}.ox .cards.ow{flex-wrap:wrap;margin-top:6px}
.cap{font-size:13px;color:var(--mute);margin:0 0 6px;line-height:1.5}.cap b{color:var(--ivory);font-weight:600}
.kpi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.kp{background:var(--felt-d);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kl{font-size:13px;color:var(--mute)}.kv{font-family:Georgia,serif;font-size:28px;line-height:1.2;color:var(--brass)}.ks{font-size:12px;color:var(--mute)}
.hb,.dv{display:grid;grid-template-columns:4.6em minmax(0,1fr) 5.2em;align-items:center;gap:10px;padding:5px 0;font-size:14px}
.hl{line-height:1.25}.hl.w{font-size:13px}.hb:has(.hl.w){grid-template-columns:7.2em minmax(0,1fr) 3.6em}
.hl small,.hv small{display:block;font-size:11px;color:var(--mute)}
.hv{text-align:right;font-family:Georgia,serif;line-height:1.2}.hv small{font-family:inherit}
.tr{height:10px;border-radius:0 4px 4px 0;background:var(--felt-l)}
.tr i{display:block;height:100%;background:var(--brass);border-radius:0 4px 4px 0}
.dz{position:relative;height:10px}.dz:before{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;border-left:1px solid var(--mute)}
.dz i{position:absolute;top:0;height:100%}.dz i.pos{left:50%;background:var(--brass);border-radius:0 4px 4px 0}.dz i.neg{right:50%;background:var(--loss);border-radius:4px 0 0 4px}
.sty{padding:10px 0;border-bottom:1px solid var(--line)}.sty .row{font-size:14px;align-items:baseline}
.sv{font-family:Georgia,serif;font-size:20px;color:var(--brass)}
.mt{position:relative;height:10px;border-radius:5px;background:var(--felt-l);margin:6px 0}
.mt .band{position:absolute;top:0;bottom:0;background:var(--line)}
.mt i{position:absolute;top:-3px;width:12px;height:16px;margin-left:-6px;border-radius:4px;background:var(--brass);box-shadow:0 0 0 2px var(--felt)}
.tc{position:relative}.tc svg{display:block;touch-action:pan-y;overflow:visible}
.tc .gl{stroke:var(--line);stroke-width:1}.tc .zl{stroke:var(--mute);stroke-width:1}
.tc .ax{fill:var(--mute);font-size:11px}
.tc .ln{fill:none;stroke:var(--brass);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.tc .dt{fill:var(--brass);stroke:var(--felt);stroke-width:2}.tc .cx{stroke:var(--mute);stroke-width:1}
.tip{display:none;position:absolute;top:2px;transform:translateX(-50%);box-shadow:0 2px 8px rgba(0,0,0,.3);background:var(--ivory);color:var(--ink);font-size:12px;line-height:1.45;padding:5px 8px;border-radius:6px;white-space:nowrap;pointer-events:none}
.dir.mid{color:var(--ok)}.dir.con{color:var(--mute)}
.res{font-family:Georgia,serif;font-size:34px;line-height:1.1;margin:6px 0 2px}
.rv{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.rv .n{width:70px}.rv .h{flex:1;color:var(--mute)}
.dc{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.dc .w{color:var(--mute);font-size:13px;margin-top:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main></main>
<nav>
<button data-t="rule" onclick="go('rule')"><span class="ic">A</span>規則</button>
<button data-t="rank" onclick="go('rank')"><span class="ic">♠</span>牌型</button>
<button data-t="pre" onclick="go('pre')"><span class="ic">♥</span>起手牌</button>
<button data-t="eq" onclick="go('eq')"><span class="ic">♦</span>勝率</button>
<button data-t="play" onclick="go('play')"><span class="ic">K</span>牌局</button>
<button data-t="rec" onclick="go('rec')"><span class="ic">♣</span>紀錄</button>
</nav>
<script src="play.js"></script>
<script src="stats.js"></script>
<script src="outs.js"></script>
<script src="range.js"></script>
<script>
const RK='23456789TJQKA',SU='♠♥♦♣';
const rd=r=>r===8?'10':RK[r];
const CAT=['高牌','一對','兩對','三條','順子','同花','葫蘆','四條','同花順'];
const CATD=['沒有任何組合，比最大的單張','兩張同點數','兩組對子','三張同點數','五張點數連續','五張同花色','三條加一對','四張同點數','同花色又連續'];
const rnd=n=>Math.floor(Math.random()*n);

function cardH(c,cls='',attr=''){
  if(c==null)return `<div class="cd slot ${cls}" ${attr}></div>`;
  const s=c&3;
  return `<div class="cd ${s===1||s===2?'red':''} ${cls}" ${attr}><span class="r">${rd(c>>2)}</span><span class="s">${SU[s]}</span></div>`;
}

function sh(m){
  for(let h=12;h>=4;h--){const k=0x1F<<(h-4);if((m&k)===k)return h}
  return (m&0x100F)===0x100F?3:-1;
}
function ev(cs){
  const cnt=new Array(13).fill(0),sm=[0,0,0,0],sc=[0,0,0,0];let rm=0;
  for(const c of cs){const r=c>>2,s=c&3;cnt[r]++;sm[s]|=1<<r;sc[s]++;rm|=1<<r}
  let fs=-1;for(let s=0;s<4;s++)if(sc[s]>=5)fs=s;
  const S=(k,a)=>{let v=k;for(let i=0;i<5;i++)v=v*16+(a[i]||0);return v};
  const top=(n,ex)=>{const o=[];for(let r=12;r>=0&&o.length<n;r--)if(cnt[r]&&!ex.includes(r))o.push(r);return o};
  if(fs>=0){const h=sh(sm[fs]);if(h>=0)return S(8,[h])}
  const q=[],t=[],p=[];
  for(let r=12;r>=0;r--){if(cnt[r]===4)q.push(r);else if(cnt[r]===3)t.push(r);else if(cnt[r]===2)p.push(r)}
  if(q.length)return S(7,[q[0],...top(1,[q[0]])]);
  if(t.length&&(t.length>1||p.length))return S(6,[t[0],Math.max(t[1]??-1,p[0]??-1)]);
  if(fs>=0){const o=[];for(let r=12;r>=0&&o.length<5;r--)if(sm[fs]>>r&1)o.push(r);return S(5,o)}
  const h=sh(rm);if(h>=0)return S(4,[h]);
  if(t.length)return S(3,[t[0],...top(2,[t[0]])]);
  if(p.length>=2)return S(2,[p[0],p[1],...top(1,[p[0],p[1]])]);
  if(p.length)return S(1,[p[0],...top(3,[p[0]])]);
  return S(0,top(5,[]));
}
const catOf=v=>Math.floor(v/1048576);
function handName(v){const c=catOf(v);if(c===8&&Math.floor(v/65536)%16===12)return '皇家同花順';return CAT[c]}
function best5(cs){
  let bv=-1,bi=[];const n=cs.length;
  for(let a=0;a<n;a++)for(let b=a+1;b<n;b++){
    const idx=[];for(let i=0;i<n;i++)if(i!==a&&i!==b)idx.push(i);
    const v=ev(idx.map(i=>cs[i]));if(v>bv){bv=v;bi=idx}
  }
  return bi;
}
function deal(k,ex=[]){
  const d=[];for(let i=0;i<52;i++)if(!ex.includes(i))d.push(i);
  for(let i=0;i<k;i++){const j=i+rnd(d.length-i);[d[i],d[j]]=[d[j],d[i]]}
  return d.slice(0,k);
}

  if(bk.length===1||bk.length===2){EQ.err='公共牌請放 0、3、4 或 5 張。';render();return}
  EQ.err='';EQ.busy=true;EQ.res=null;render();
  const hole=EQ.h.slice(),known=[...hole,...bk],d=[];
  for(let i=0;i<52;i++)if(!known.includes(i))d.push(i);
  const nb=5-bk.length,need=nb+2*EQ.opp,N=EQ.opp>3?5000:8000,opp=EQ.opp;
  let it=0,win=0,tie=0;
  const step=()=>{
    const end=Math.min(N,it+1000);
    for(;it<end;it++){
      const n=d.length;
      for(let k=0;k<need;k++){const j=k+rnd(n-k);const x=d[k];d[k]=d[j];d[j]=x}
      const board=bk.concat(d.slice(0,nb));const me=ev(hole.concat(board));
      let best=-1,cnt=0;
      for(let o=0;o<opp;o++){const p=nb+o*2;const v=ev([d[p],d[p+1],...board]);if(v>best){best=v;cnt=1}else if(v===best)cnt++}
      if(me>best)win++;else if(me===best)tie+=1/(cnt+1);
    }
    if(it<N)setTimeout(step,0);
    else{EQ.busy=false;EQ.res={w:win/N,t:tie/N,cur:bk.length>=3?handName(ev(hole.concat(bk))):null};ST.eqN++;save();render()}
  };
  setTimeout(step,30);
}
function rEq(){
  const seg=`<div class="seg" style="margin-bottom:6px"><button class="${EQM==='calc'?'on':''}" onclick="EQM='calc';render()">算勝率</button><button class="${EQM==='outs'?'on':''}" onclick="EQM='outs';render()">Outs 練習</button><button class="${EQM==='tips'?'on':''}" onclick="EQM='tips';render()">速算小抄</button></div>`;
  if(EQM==='tips'){M.innerHTML=`<h1>勝率</h1><p class="sub">牌桌上心算要背的數字，都用模擬或公式算過</p>${seg}${rTips()}`;return}
  if(EQM==='outs'){M.innerHTML=`<h1>勝率</h1><p class="sub">一步一步學會數 outs、算機率，決定跟還是蓋</p>${seg}${rOuts()}`;return}
  const sl=(t,i)=>{const sel=EQ.sel[0]===t&&EQ.sel[1]===i,c=EQ[t][i];return cardH(c,'tap '+(sel?(c==null?'sel':'hl'):''),`onclick="eqSel('${t}',${i})"`)};
  const u=used();
  let pk='<div class="pick">';
  for(let s=0;s<4;s++)for(let r=12;r>=0;r--){const c=r*4+s;pk+=`<button class="${s===1||s===2?'red':''}" ${u.includes(c)?'disabled':''} onclick="eqPick(${c})" aria-label="${SU[s]}${rd(r)}">${rd(r)}<br>${SU[s]}</button>`}
  pk+='</div>';
  let h=`<h1>勝率</h1><p class="sub">選好手牌和公共牌，模擬幾千局算出勝率</p>${seg}
  <div class="lbl">你的手牌</div><div class="cards">${sl('h',0)}${sl('h',1)}</div>
  <div class="lbl">公共牌（可留空）</div><div class="cards">${[0,1,2,3,4].map(i=>sl('b',i)).join('')}</div>
  <div class="lbl">點上面的格子選位置，再從下面挑牌</div>${pk}
  <div class="grid2" style="margin-top:10px"><button onclick="eqClear()">清除這格</button><button onclick="eqReset()">全部重來</button></div>
  <div class="row" style="margin-top:16px"><span>對手人數</span><div class="stepper"><button onclick="eqOpp(-1)" aria-label="減少">−</button><span>${EQ.opp}</span><button onclick="eqOpp(1)" aria-label="增加">+</button></div></div>
  <button class="pri full" style="margin-top:14px" onclick="eqRun()" ${EQ.busy?'disabled':''}>${EQ.busy?'計算中…':'計算勝率'}</button>`;
  if(EQ.err)h+=`<p class="err">${EQ.err}</p>`;
  if(EQ.res){
    const e=EQ.res.w+EQ.res.t,ep=Math.round(e*1000)/10;
    h+=`<div class="fb"><div class="big-n">${ep}%</div>
    <div class="muted">直接獲勝 ${Math.round(EQ.res.w*1000)/10}%，平手分得 ${Math.round(EQ.res.t*1000)/10}%</div>
    ${EQ.res.cur?`<div style="margin-top:8px">目前牌型：<b>${EQ.res.cur}</b></div>`:''}
    <div style="margin-top:8px;font-size:14px">怎麼用：跟注金額 ÷（底池＋跟注金額）低於 ${ep}% 時，長期來看跟注划算。</div></div>`;
  }
  M.innerHTML=h;
}

/* 紀錄 */
function exp(){
  const b=new Blob([JSON.stringify(ST,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='poker-trainer-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();
}
// 清除紀錄：只清成績；對手名字、打法和各項開關保留，籌碼歸位
function clr(){
  if(!confirm('確定要清除所有練習和牌局紀錄？（對手的名字、打法和設定會保留，籌碼回到起始）'))return;
  const g=ST.game,keep={opp:g.opp,hint:g.hint,calc:g.calc,bar:g.bar};
  ST=blank();Object.assign(ST.game,keep);ST.game.stacks=Array(oppList().length+1).fill(START);
  clearTimeout(G.timer);G={phase:'idle',P:[],board:[],log:[],dec:[]};save();render();
}
let REC='pr';
function rRec(){
  const sa=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  let h=`<h1>紀錄</h1><p class="sub">練習成績只存在這支手機裡</p>
  <div class="seg"><button class="${REC==='pr'?'on':''}" onclick="REC='pr';render()">練習成績</button><button class="${REC==='an'?'on':''}" onclick="REC='an';render()">牌局分析</button></div>`;
  if(REC==='an')h+=statsH();
  else{
    const w=Object.entries(ST.wrong).sort((a,b)=>b[1]-a[1]).slice(0,10);
    const row=(n,o)=>`<div class="stat"><span>${n}</span><span><span class="v">${pct(o)}</span> <span class="muted">${o.c}/${o.t}</span></span></div>`;
    h+=`${row('認牌型',ST.name)}${row('比大小',ST.vs)}${row('起手牌',ST.pre)}${row('Outs 計算',ST.outs)}
    <div class="stat"><span>勝率計算</span><span class="muted">已算 ${ST.eqN} 次</span></div>
    <div class="stat"><span>模擬牌局</span><span class="muted">已打 ${ST.play.hands} 手　<a href="#" onclick="REC='an';render();return false">看分析</a></span></div>
    <div class="lbl" style="margin-top:20px">起手牌最常答錯</div>
    ${w.length?w.map(([l,n])=>`<div class="stat"><span>${dl(l)}　<span class="muted">${TN[tierOf(l)]}</span></span><span class="muted">錯 ${n} 次</span></div>`).join(''):'<p class="muted">還沒有答錯的紀錄。</p>'}`;
  }
  h+=`<div class="grid2" style="margin-top:20px"><button onclick="exp()">匯出紀錄</button><button onclick="clr()">清除紀錄</button></div>`;
  if(!sa)h+=`<div class="fb">加到主畫面：iPhone 用 Safari 點「分享」→「加入主畫面」；Android 用 Chrome 點右上選單 →「加到主畫面」。</div>`;
  M.innerHTML=h;
}

go(ST.name.t+ST.vs.t+ST.pre.t?'rank':'rule');
